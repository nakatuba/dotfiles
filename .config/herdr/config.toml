onboarding = false

[keys]
prefix = "ctrl+s"
detach = "prefix+d"
split_vertical = "prefix+%"
split_horizontal = "prefix+\""

[ui]
prompt_new_tab_name = false

[[keys.command]]
key = "prefix+s"
type = "popup"
command = '''
herdr workspace list |
  jq -r '.result.workspaces[] | select(.focused | not) | "\(.workspace_id)\t\(.label)"' |
  fzf --reverse --with-nth 2 |
  cut -f 1 |
  xargs herdr workspace focus > /dev/null
'''
description = "switch workspace"

[[keys.command]]
key = "prefix+C"
type = "popup"
command = '''
if repo=$(ghq list | fzf --reverse); then
  label=$(basename "$repo" | tr . _)
  workspace_id=$(herdr workspace list | jq -r --arg label "$label" 'first(.result.workspaces[] | select(.label == $label)).workspace_id')
  if [ -n "$workspace_id" ]; then
    herdr workspace focus "$workspace_id" > /dev/null
  else
    herdr workspace create --cwd "$(ghq root)/$repo" --label "$label" --focus > /dev/null
  fi
fi
'''
description = "create workspace"
